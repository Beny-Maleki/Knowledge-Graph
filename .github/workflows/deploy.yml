name: Test & deploy to GitHub Pages

# Works with either GitHub Pages setting (Settings → Pages → Build and deployment → Source):
#   • "GitHub Actions"        → the `deploy` job publishes the build directly (recommended).
#   • "Deploy from a branch"  → choose `gh-pages` / root; the `build` job keeps that branch up to date.

on:
  push:
    branches:
      - main
      - claude/pensive-sagan-3b1cjb
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the gh-pages branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Deploy ${{ github.sha }}'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only succeeds when the Pages source is "GitHub Actions"; with a branch source
    # the gh-pages branch above is what gets served, so a failure here is harmless.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
